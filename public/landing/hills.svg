<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="240" viewBox="0 0 1440 240">
  <defs>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121b30"/>
      <stop offset="1" stop-color="#070b15"/>
    </linearGradient>
  </defs>

  <!-- leaning wooden cross -->
  <g fill="#0d1424" transform="rotate(-14 250 140)">
    <path d="M232 40 L240 30 L252 36 L262 28 L270 38 L270 220 L232 220 Z"/>
    <path d="M176 92 L326 84 L330 116 L180 124 Z"/>
    <path d="M238 40 L244 60 M256 36 L254 70" stroke="#18213a" stroke-width="3"/>
  </g>

  <!-- small crosses -->
  <g fill="#0b1221">
    <rect x="408" y="96" width="7" height="110"/>
    <rect x="382" y="120" width="60" height="7"/>
