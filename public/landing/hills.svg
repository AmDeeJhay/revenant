    <rect x="1114" y="70" width="10" height="150"/>
    <rect x="1084" y="104" width="70" height="10"/>
  </g>

  <!-- hill line -->
  <path fill="url(#hill)" d="M0 176 L120 168 L260 184 L420 170 L560 158 L700 150 L860 160 L1000 154 L1160 170 L1300 162 L1440 172 L1440 240 L0 240 Z"/>
