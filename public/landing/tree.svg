<svg xmlns="http://www.w3.org/2000/svg" width="540" height="580" viewBox="0 0 540 580">
  <defs>
    <linearGradient id="bark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#04060b"/>
      <stop offset="0.6" stop-color="#0b111e"/>
      <stop offset="1" stop-color="#131b2d"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a7a96" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#6a7a96" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6a7a96" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- fine twigs -->
  <g fill="none" stroke="#18203a" stroke-width="1.5" stroke-linecap="round">
    <path d="M330 58 C380 44 420 22 470 0"/>
    <path d="M372 64 C420 76 470 60 532 92"/>
    <path d="M400 70 C440 100 476 124 500 176"/>
    <path d="M300 214 C344 200 384 222 430 212"/>
    <path d="M330 292 C360 286 386 306 428 302"/>
    <path d="M262 392 L292 408 L326 404"/>
    <path d="M214 40 C240 30 262 10 270 0"/>
  </g>

  <!-- branches, each rooted in the trunk -->
  <g fill="none" stroke="url(#bark)" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="28" d="M96 196 C150 170 182 130 226 108 L258 64 L300 58 L330 30 L372 0"/>
    <path stroke-width="16" d="M226 108 L276 100 L300 70 L340 66 L372 64 L400 70"/>
    <path stroke-width="18" d="M104 262 C150 252 180 236 214 226 L240 196 L300 214"/>
    <path stroke-width="12" d="M214 226 L254 248 L290 244 L330 292"/>
    <path stroke-width="14" d="M98 334 L156 318 L140 280"/>
    <path stroke-width="12" d="M104 360 L170 340 L200 372 L262 392"/>
    <path stroke-width="20" d="M86 140 L120 92 L104 54 L144 22 L156 0"/>
    <path stroke-width="12" d="M120 92 L170 84 L196 46 L214 40"/>
  </g>

  <!-- trunk: enters from the top-left, bows out, roots at the bottom -->
  <path fill="url(#bark)" d="M0 0 L74 0 C80 50 96 100 112 150 C130 206 128 260 112 318 C98 370 104 430 138 500 C150 526 164 552 176 580 L0 580 Z"/>
  <!-- knot -->
  <path fill="#03050a" d="M70 276 C80 268 92 272 92 286 C92 300 80 304 72 296 Z"/>

  <!-- cold light streaks on the bark -->
  <g fill="url(#streak)">
    <path d="M44 120 C64 160 58 196 48 220 C70 246 84 282 66 316 C56 336 70 362 90 378 C76 350 80 328 92 306 C104 280 86 250 72 226 C84 196 76 154 44 120 Z"/>
    <path d="M22 270 C34 306 30 342 38 378 C48 414 40 450 56 476 C48 440 60 414 52 380 C44 346 46 306 22 270 Z" opacity="0.6"/>
  </g>
</svg>
