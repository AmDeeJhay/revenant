    <path fill="none" stroke="#5a5f92" stroke-width="1.2" stroke-linecap="round" d="M80 44 L76 52 L80 58 L77 64 M40 90 L44 94 L42 100"/>
    <path fill="#0b0f1f" d="M90 40 L86 46 L90 50 Z"/>
