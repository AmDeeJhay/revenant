    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9cf55"/>
      <stop offset="1" stop-color="#7e7a26"/>
    </linearGradient>
  </defs>

  <ellipse cx="62" cy="108" rx="44" ry="6" fill="#000" opacity="0.4"/>

  <g transform="rotate(-4 62 70)">
