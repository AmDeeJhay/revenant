    <path d="M86 109 C88 104 90 101 93 98 C92 102 93 104 95 106 C96 101 99 97 102 95 C101 100 101 103 103 106 Z"/>
  </g>

  <!-- candle -->
  <path fill="url(#wax)" d="M30 22 C30 20 40 20 40 22 L40 44 C40 46 30 46 30 44 Z"/>
  <ellipse cx="35" cy="22" rx="5" ry="1.7" fill="#f7aab4"/>
  <path fill="#ffd56e" d="M30 22 C30 26 31 31 32.5 31 C34 31 33.5 26 34.5 25 C35.5 28 36 33 37.5 33 C39 33 38.5 26 40 24 L40 22 C38 23 32 23 30 22 Z"/>
