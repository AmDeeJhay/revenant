<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#b3b8e6"/>
      <stop offset="0.55" stop-color="#8d92c6"/>
      <stop offset="1" stop-color="#5f6496"/>
    </linearGradient>
    <linearGradient id="wax" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f58a98"/>
      <stop offset="0.45" stop-color="#e0566b"/>
      <stop offset="1" stop-color="#b23c55"/>
