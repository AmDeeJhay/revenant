      <path fill="#d4d7f5" d="M0 -12 C8 -12 12 -6 12 0 C12 5 9 7 7 8 V12 H-7 V8 C-9 7 -12 5 -12 0 C-12 -6 -8 -12 0 -12 Z"/>
