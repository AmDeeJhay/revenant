      <ellipse cx="5" cy="-1" rx="3.4" ry="3.8" fill="#3e4273"/>
      <path fill="#3e4273" d="M0 3 L-2 7 H2 Z"/>
      <path stroke="#3e4273" stroke-width="1" d="M-3 9 V12 M0 9 V12 M3 9 V12"/>
    </g>
